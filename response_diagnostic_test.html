<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Response Diagnostic Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      color: #1c2333;
      background: #f4f7fb;
    }
    h1 { font-size: 1.2rem; color: #2557a7; margin-bottom: 4px; }
    p.sub { font-size: 0.85rem; color: #6b7280; margin: 0 0 20px; }

    .info-box {
      background: #f0f4ff;
      border: 1px solid #c7d2fe;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.82rem;
      color: #3730a3;
      margin-bottom: 20px;
      direction: ltr;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-all;
    }

    button {
      padding: 10px 22px;
      background: #2557a7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      min-height: 44px;
    }
    button:disabled { opacity: 0.5; cursor: default; }

    #result {
      margin-top: 24px;
      padding: 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      white-space: pre-wrap;
      word-break: break-all;
      display: none;
      direction: ltr;
      text-align: left;
    }
    .pass { background: #f0faf5; border: 1.5px solid #197a4a; color: #145c38; }
    .fail { background: #fdf3f2; border: 1.5px solid #c0392b; color: #922b21; }
    .label { font-weight: bold; display: block; font-size: 1.05rem; margin-bottom: 10px; }

    .section { margin-top: 14px; padding-top: 10px; border-top: 1px solid rgba(0,0,0,0.1); }
    .section-title { font-weight: bold; font-size: 0.8rem; opacity: 0.7; margin-bottom: 4px; }
  </style>
</head>
<body>

  <h1>Response Diagnostic Test</h1>
  <p class="sub">
    בדיקת מנגנון ContentService בלבד — ללא כתיבה לגיליון, ללא lock, ללא token.
  </p>

  <p style="font-size:0.85rem;color:#374151;margin-bottom:8px;">Payload שישלח:</p>
  <div class="info-box">{"action":"response_diagnostic"}</div>

  <button id="btn" onclick="runDiagnostic()">הרץ Response Diagnostic</button>

  <div id="result"></div>

<script>
  var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyWdphfXL7W60Ct5F4rrfdj-ZgPQaqQgKxDHv3OXZr5SNmoZrNuIVtd-VPFHPHc5DlM/exec';

  function runDiagnostic() {
    var btn = document.getElementById('btn');
    var resultDiv = document.getElementById('result');

    btn.disabled = true;
    btn.textContent = 'שולח...';
    resultDiv.style.display = 'none';
    resultDiv.className = '';
    resultDiv.textContent = '';

    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
      body: JSON.stringify({ action: 'response_diagnostic' }),
      redirect: 'follow'
    })
    .then(function(res) {
      var httpStatus = res.status;
      var responseType = res.type;
      var responseUrl  = res.url;
      var contentType  = res.headers.get('Content-Type') || '(header not accessible)';

      return res.text().then(function(rawText) {
        return {
          httpStatus:  httpStatus,
          responseType: responseType,
          responseUrl:  responseUrl,
          contentType:  contentType,
          rawText:      rawText
        };
      });
    })
    .then(function(info) {
      var lines = [];
      var passed = false;
      var parsed = null;
      var parseError = null;

      // 1. HTTP metadata
      lines.push('── HTTP Metadata ──────────────────────────────');
      lines.push('HTTP status:       ' + info.httpStatus);
      lines.push('response.type:     ' + info.responseType);
      lines.push('response.url:      ' + info.responseUrl);
      lines.push('Content-Type:      ' + info.contentType);

      // 2. Raw body (first 500 chars)
      lines.push('');
      lines.push('── Raw Response Body (first 500 chars) ────────');
      lines.push(info.rawText.substring(0, 500));
      if (info.rawText.length > 500) {
        lines.push('... [truncated — total ' + info.rawText.length + ' chars]');
      }

      // 3. JSON parse attempt
      lines.push('');
      lines.push('── JSON Parse Attempt ─────────────────────────');
      try {
        parsed = JSON.parse(info.rawText);
        lines.push('JSON.parse: SUCCESS');
        lines.push('parsed.status:     ' + parsed.status);
        lines.push('parsed.diagnostic: ' + parsed.diagnostic);
        lines.push('parsed.service:    ' + parsed.service);

        passed = (
          parsed.status === 'success' &&
          parsed.diagnostic === 'response_diagnostic' &&
          parsed.service === 'shia-hashkava'
        );
      } catch (parseErr) {
        parseError = parseErr.message;
        lines.push('JSON.parse: FAILED');
        lines.push('Parse error: ' + parseError);
      }

      // 4. Verdict
      lines.push('');
      lines.push('── Verdict ────────────────────────────────────');
      lines.push(passed ? '✅ PASS' : '❌ FAIL');

      if (!passed && parsed) {
        lines.push('');
        lines.push('── Failure Detail ─────────────────────────────');
        if (parsed.status !== 'success')              lines.push('• status !== "success" (got: ' + parsed.status + ')');
        if (parsed.diagnostic !== 'response_diagnostic') lines.push('• diagnostic field missing or wrong');
        if (parsed.service !== 'shia-hashkava')       lines.push('• service field missing or wrong');
      }

      resultDiv.className = passed ? 'pass' : 'fail';
      resultDiv.textContent = lines.join('\n');
      resultDiv.style.display = 'block';

      // כפתור מופעל מחדש תמיד — הפעולה היא read-only
      btn.disabled = false;
      btn.textContent = 'הרץ שוב';
    })
    .catch(function(networkErr) {
      var lines = [];
      lines.push('❌ FAIL — Network / fetch error');
      lines.push('');
      lines.push('Error: ' + networkErr.message);

      resultDiv.className = 'fail';
      resultDiv.textContent = lines.join('\n');
      resultDiv.style.display = 'block';

      btn.disabled = false;
      btn.textContent = 'נסה שוב';
    });
  }
</script>

</body>
</html>
